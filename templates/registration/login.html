
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — SubWatch</title>
    <link rel="stylesheet" href="{% static 'subscriptions/css/style.css' %}">
</head>
<body>
    <main class="container">
        <header class="header">
            <div>
                <h1 class="logo">SubWatch</h1>
                <p class="subtitle">
                    Контроль подписок и регулярных платежей
                </p>
            </div>
        </header>

        <section class="login-wrapper">
            <div class="card login-card">
                <h2 class="section-title">Вход в аккаунт</h2>
                <p class="login-description">
                    Войдите, чтобы управлять своими подписками.
                </p>

                {% if form.errors %}
                    <div class="login-error">
                        Неверное имя пользователя или пароль.
                        Попробуйте ещё раз.
                    </div>
                {% endif %}

                <form method="post" class="login-form">
                    {% csrf_token %}

                    <div class="login-field">
                        <label for="id_username">Имя пользователя</label>
                        <input
                            type="text"
                            name="username"
                            id="id_username"
                            placeholder="Введите имя пользователя"
                            autocomplete="username"
                            required
                            autofocus
                        >
                    </div>

                    <div class="login-field">
                        <label for="id_password">Пароль</label>
                        <input
                            type="password"
                            name="password"
                            id="id_password"
                            placeholder="Введите пароль"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <input type="hidden" name="next" value="{{ next }}">

                    <button type="submit" class="button login-submit">
                        Войти
                    </button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
